name: Metrics

on:
  schedule: [{ cron: "0 6 * * *" }]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate profile details SVG
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ItamarJuniorDEV

          # Esse é o arquivo que o README usa:
          filename: assets/profile-details.svg

          # Conteúdo do card (o mais próximo do "profile-details")
          template: classic
          base: header, activity, community, repositories

          # Ajuste de fuso (opcional)
          config_timezone: America/Sao_Paulo
